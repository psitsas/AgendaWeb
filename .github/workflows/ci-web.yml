name: Agendi Web CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ════════════════════════════════════════════════
  #  1. BUILD
  # ════════════════════════════════════════════════
  build:
    name: Build panel web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build producción
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.agendi.app' }}

      - name: Subir artefacto dist/
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ════════════════════════════════════════════════
  #  2. DEPLOY a Cloudflare Pages (solo main)
  # ════════════════════════════════════════════════
  deploy:
    name: Deploy a Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:     ${{ secrets.CF_API_TOKEN }}
          accountId:    ${{ secrets.CF_ACCOUNT_ID }}
          projectName:  agendi-web
          directory:    dist
          gitHubToken:  ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen del deploy
        if: always()
        run: |
          echo "### Deploy Web ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://agendi-web.pages.dev" >> $GITHUB_STEP_SUMMARY
